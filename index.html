<title>ドット商事 3F</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one centered column — status header, pixel game screen, task meters, staff roster.
   Deliberately single-theme: a dark "evening monitor" frame around a warm daytime office. */
:root{
  --bg:#11131b;
  --panel:#1a1e2c;
  --edge:#363d5a;
  --ink:#08090e;
  --fg:#efe8d8;
  --muted:#9aa0b8;
  --accent:#ffcf4a;
  --good:#6fd08c;
  --warn:#ff8a5c;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",monospace;
  --ar:1.4667;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{
  font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 32px;
}
.wrap{max-width:1068px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.px{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--edge),0 0 0 6px var(--ink)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-inline:6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:none;background:
  linear-gradient(var(--accent),var(--accent)) 6px 6px/8px 8px no-repeat,
  linear-gradient(var(--good),var(--good)) 20px 6px/8px 8px no-repeat,
  linear-gradient(#7fb6ff,#7fb6ff) 6px 20px/8px 8px no-repeat,
  linear-gradient(var(--warn),var(--warn)) 20px 20px/8px 8px no-repeat,
  var(--panel);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--edge)}
h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:400;letter-spacing:.06em;line-height:1.2;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13px;letter-spacing:.08em}
.hud{display:flex;flex-wrap:wrap;gap:10px}
.stat{display:flex;flex-direction:column;align-items:flex-start;background:var(--panel);padding:4px 12px 5px;min-width:84px;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--edge)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.12em}
.stat b{font-weight:400;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat.time b{color:var(--accent)}
.stat.scold b{color:var(--warn)}

/* game screen */
.screen{position:relative;margin-inline:auto;width:min(100%,max(300px,calc((100vh - 250px) * var(--ar))));
  width:min(100%,max(300px,calc((100dvh - 250px) * var(--ar))));
  aspect-ratio:var(--ar);max-width:100%;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer}
canvas:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.dialog{position:absolute;left:2.5%;right:2.5%;bottom:3%;background:rgba(14,16,26,.95);
  box-shadow:inset 0 0 0 2px var(--fg),inset 0 0 0 4px #0e101a;padding:clamp(8px,1.6vw,16px) clamp(12px,2.2vw,22px);
  font-size:clamp(13px,1.9vw,19px);line-height:1.65;min-height:24%;cursor:pointer}
.dname{display:inline-block;color:var(--ink);background:var(--accent);padding:0 8px;margin-bottom:4px;font-size:.82em;letter-spacing:.06em}
.dtext{margin:0;white-space:pre-wrap}
.dnext{position:absolute;right:14px;bottom:8px;color:var(--accent);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.toasts{position:absolute;top:3%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--accent);color:var(--ink);padding:3px 12px;font-size:clamp(12px,1.6vw,16px);
  box-shadow:0 0 0 2px var(--ink);animation:toast 2.8s steps(8) forwards;max-width:92%;text-align:center}
@keyframes toast{0%{transform:translateY(-6px);opacity:0}8%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.float{position:absolute;transform:translate(-50%,-100%);font-size:clamp(11px,1.5vw,16px);pointer-events:none;
  text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000;animation:rise .9s steps(9) forwards;white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-220%);opacity:0}}
.fade{position:absolute;inset:0;background:#0b0c14;display:grid;place-items:center;font-size:clamp(18px,3vw,30px);
  letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity .5s steps(5)}
.fade.on{opacity:1}

/* task meters */
.meters{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px 18px;background:var(--panel);padding:12px 16px;margin-top:4px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter .row{display:flex;justify-content:space-between;gap:8px;min-width:0}
.meter .val{font-variant-numeric:tabular-nums;color:var(--muted)}
.taskname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:var(--ink);padding:2px;box-shadow:0 0 0 2px var(--edge)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--good) 0 8px,transparent 8px 10px)}
.bar.energy i{background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 10px)}
.bar.energy.low i{background:repeating-linear-gradient(90deg,var(--warn) 0 8px,transparent 8px 10px)}
.hint{grid-column:1/-1;margin:0;color:var(--accent);font-size:14px}
.hint::before{content:"▶ ";color:var(--muted)}

/* touch pad */
.pad{display:none;justify-content:space-between;align-items:center;gap:16px;padding:6px 4px}
@media (hover:none) and (pointer:coarse){.pad{display:flex}.keys{display:none}}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
.pad button{font:inherit;color:var(--fg);background:var(--panel);border:0;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--edge);
  touch-action:none;font-size:20px;-webkit-tap-highlight-color:transparent}
.pad button:active,.pad button.on{background:var(--edge)}
.dpad [data-dir=up]{grid-area:1/2}.dpad [data-dir=left]{grid-area:2/1}.dpad [data-dir=right]{grid-area:2/3}.dpad [data-dir=down]{grid-area:3/2}
.abtn{width:84px;height:84px;color:var(--ink)!important;background:var(--accent)!important;font-size:26px!important}
.abtn:active{filter:brightness(.85)}

/* roster */
.roster h2{margin:0 0 10px;font-weight:400;font-size:17px;letter-spacing:.1em;color:var(--muted)}
.roster ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.roster li{display:flex;gap:10px;align-items:center;background:var(--panel);padding:8px 10px;min-width:0;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--edge)}
.face{width:28px;height:28px;flex:none;image-rendering:pixelated}
.who{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.who .nm{white-space:nowrap}
.who .role{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.st{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st::before{content:"■ ";font-size:10px}
.st.sit::before{color:var(--good)}.st.idle::before{color:var(--accent)}.st.walk::before{color:var(--muted)}.st.talk::before{color:var(--warn)}
.keys{margin:0;color:var(--muted);font-size:13px;line-height:1.9}
kbd{font-family:inherit;color:var(--fg);background:var(--panel);padding:0 6px;box-shadow:0 0 0 1px var(--edge)}
@media (max-width:640px){.meters{grid-template-columns:minmax(0,1fr)}.stat{min-width:70px}}
@media (prefers-reduced-motion:reduce){.toast,.float,.dnext{animation-duration:.01s}.float{display:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div><h1>ドット商事 3F</h1><p class="sub">営業企画部フロア ／ 社員 8 名 ＋ あなた</p></div>
    </div>
    <div class="hud">
      <div class="stat"><span class="lbl">日付</span><b id="day">1日目（月）</b></div>
      <div class="stat time"><span class="lbl">時刻</span><b id="clock">09:00</b></div>
      <div class="stat"><span class="lbl">完了タスク</span><b id="done">0 件</b></div>
      <div class="stat scold"><span class="lbl">怒られた</span><b id="scold">0 回</b></div>
    </div>
  </header>

  <div class="screen px" id="screen">
    <canvas id="game" tabindex="0" aria-label="オフィスのドット絵ゲーム画面。矢印キーで移動、スペースキーで話す・調べる"></canvas>
    <div class="toasts" id="toasts"></div>
    <div class="dialog" id="dialog" hidden><span class="dname" id="dname"></span><p class="dtext" id="dtext"></p><span class="dnext" aria-hidden="true">▼</span></div>
    <div class="fade" id="fade"></div>
  </div>

  <div class="pad" id="pad">
    <div class="dpad">
      <button type="button" data-dir="up" aria-label="上へ">▲</button>
      <button type="button" data-dir="left" aria-label="左へ">◀</button>
      <button type="button" data-dir="right" aria-label="右へ">▶</button>
      <button type="button" data-dir="down" aria-label="下へ">▼</button>
    </div>
    <button type="button" class="abtn" id="abtn" aria-label="話す・調べる・作業">A</button>
  </div>

  <section class="meters px">
    <div class="meter">
      <div class="row"><span class="lbl">いまのタスク</span><span class="val" id="taskPct">0%</span></div>
      <span class="taskname" id="taskName">—</span>
      <div class="bar"><i id="taskBar"></i></div>
    </div>
    <div class="meter">
      <div class="row"><span class="lbl">集中力</span><span class="val" id="energyVal">80</span></div>
      <span class="taskname" id="energyNote">まだまだいける</span>
      <div class="bar energy" id="energyWrap"><i id="energyBar"></i></div>
    </div>
    <p class="hint" id="hint">▼印のデスクがあなたの席です</p>
  </section>

  <p class="keys">移動 <kbd>←↑↓→</kbd> / <kbd>WASD</kbd>　話す・調べる・作業 <kbd>Space</kbd> / <kbd>Z</kbd> / <kbd>Enter</kbd>　画面をクリックすると、その場所まで歩きます</p>

  <section class="roster">
    <h2>フロアの社員</h2>
    <ul id="roster"></ul>
  </section>
</div>

<script>
(function(){
'use strict';
const T=16, COLS=22, ROWS=15, W=COLS*T, H=ROWS*T;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const screenEl=document.getElementById('screen');
let VW=COLS, VH=ROWS, camX=0, camY=0;
const O='#1d1b26';

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function hash(a,b,s){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul((s|0)+1,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function shade(h,f){const c=hex2rgb(h);return rgb2hex(...c.map(v=>Math.max(0,Math.min(255,Math.round(v*f)))));}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(...A.map((v,i)=>Math.round(v+(B[i]-v)*t)));}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const DIRS4=[[0,1],[1,0],[-1,0],[0,-1]];
function dirTo(x,y,nx,ny){return nx>x?'right':nx<x?'left':ny>y?'down':'up';}
const grid=v=>[...Array(ROWS)].map(()=>Array(COLS).fill(v));

/* ---------------- state ---------------- */
const TASKS=['メール返信（12件）','見積書の作成','会議資料のまとめ','議事録の清書','経費精算','企画書のたたき台','売上データの集計','顧客リストの整理','週報の作成','プレゼン資料の修正'];
const WEEK=['月','火','水','木','金'];
const S={min:540,day:1,done:0,taskIdx:0,task:{name:TASKS[0],progress:0},energy:80,firstSat:false,lastMin:540,lastWork:540,scolded:0,warned:false,shake:0,flash:0};

/* ---------------- map ---------------- */
const blocked=grid(0), objAt=grid(null), seatAt=grid(null), sitSpot=grid(null);
for(let x=0;x<COLS;x++){blocked[0][x]=blocked[1][x]=blocked[14][x]=1;}
for(let y=2;y<=13;y++) if(y!==5&&y!==11) blocked[y][15]=1;
for(let x=16;x<=21;x++) if(x!==18) blocked[8][x]=1;

function floorType(x,y){
  if(y<2||y>=14) return null;
  if(x<15) return 'carpet';
  if(x===15) return 'carpet';
  if(y<8) return 'wood';
  if(y===8) return 'wood';
  return 'tile';
}

/* static background */
const bg=document.createElement('canvas'); bg.width=W; bg.height=H;
(function buildBG(){
  const b=bg.getContext('2d');
  const F=(x,y,w,h,c)=>{b.fillStyle=c;b.fillRect(x,y,w,h);};
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const X=x*T,Y=y*T,f=floorType(x,y);
    if(f==='carpet'){
      F(X,Y,16,16,(x+y)%2?'#4b5979':'#4f5d7f');
      F(X,Y,16,1,'#46536f');F(X,Y,1,16,'#46536f');
      for(let k=0;k<4;k++)F(X+1+((hash(x,y,k)*14)|0),Y+1+((hash(y,x,k+9)*14)|0),1,1,'#58678c');
    }else if(f==='wood'){
      F(X,Y,16,16,'#a87b4f');
      for(let k=0;k<4;k++){F(X,Y+k*4,16,1,'#b48659');F(X,Y+k*4+3,16,1,'#8f6541');F(X+((hash(x,y,k)*16)|0),Y+k*4,1,3,'#8f6541');}
    }else if(f==='tile'){
      for(let i=0;i<2;i++)for(let j=0;j<2;j++)F(X+i*8,Y+j*8,8,8,(i+j)%2?'#e4dac6':'#d6c9ae');
    }
  }
  // top wall
  for(let x=0;x<COLS;x++){
    const X=x*T, face=x>=16?'#cdd5da':'#d9d0be', fs=x>=16?'#c0c9cf':'#cdc3ae';
    F(X,0,16,6,'#2c3146');F(X,6,16,1,'#4a5272');F(X,7,16,22,face);F(X,7,16,1,x>=16?'#e3e9ec':'#ebe3d2');
    if(x%2===0)F(X,8,1,21,fs);
    F(X,29,16,3,'#7b6a57');F(X,29,16,1,'#93806a');
  }
  F(0,32,240,2,'rgba(0,0,0,.18)');F(256,32,96,2,'rgba(0,0,0,.18)');
  // vertical partition x=15
  for(let y=0;y<=13;y++){
    if(y===5||y===11) continue;
    const Y=y*T;
    F(244,Y,8,16,'#2c3146');F(244,Y,1,16,'#4a5272');F(251,Y,1,16,'#22263a');
    if(y===4||y===10)F(243,Y+14,10,2,'#4a5272');
    if(y===6||y===12)F(243,Y,10,2,'#4a5272');
  }
  for(const y of [5,11]){F(246,y*T,4,16,'#6d6458');F(246,y*T,4,1,'#857b6d');}
  // horizontal partition row 8
  for(let x=16;x<=21;x++){
    const X=x*T;
    if(x===18){F(X,136,16,8,'#d6c9ae');F(X,128,2,14,'#2c3146');F(X+14,128,2,14,'#2c3146');F(X+2,135,12,2,'#6d6458');continue;}
    F(X,128,16,5,'#2c3146');F(X,133,16,1,'#4a5272');F(X,134,16,8,'#cdd5da');F(X,134,16,1,'#e3e9ec');F(X,142,16,2,'#7b6a57');
  }
  F(256,144,32,2,'rgba(0,0,0,.15)');F(304,144,48,2,'rgba(0,0,0,.15)');
  // bottom wall
  F(0,224,W,16,'#2c3146');F(0,224,W,1,'#4a5272');
  for(let x=0;x<COLS;x+=2)F(x*T+6,230,4,4,'#252a3d');
})();

/* ---------------- furniture ---------------- */
const furn=[], decor=[];
function add(o){
  o.w=o.w||1;o.h=o.h||1;if(o.sortY==null)o.sortY=(o.y+o.h)*T;furn.push(o);
  for(let j=0;j<o.h;j++)for(let i=0;i<o.w;i++){
    if(o.solid!==false)blocked[o.y+j][o.x+i]=1;
    if(o.interact!==false)objAt[o.y+j][o.x+i]=o;
  }
  return o;
}
function addDecor(o){decor.push(o);for(let i=0;i<o.w;i++)objAt[1][o.x+i]=o;}

const STAFF=[
 {id:'sato',name:'佐藤 美咲',role:'営業',hair:'#7a4a2e',skin:'#f4c9a8',shirt:'#e98aa6',pants:'#3d3b55',long:true,collar:false,seat:[1,2],screen:'mail'},
 {id:'tanaka',name:'田中 健太',role:'エンジニア',hair:'#23222c',skin:'#eabf98',shirt:'#4f9a6b',pants:'#2f3445',glasses:true,collar:false,seat:[4,2],screen:'code'},
 {id:'takahashi',name:'高橋 葵',role:'デザイナー',hair:'#8a5bb8',skin:'#f6d2b4',shirt:'#f2c94c',pants:'#2d2f3a',collar:false,seat:[7,2],screen:'design'},
 {id:'ito',name:'伊藤 誠',role:'経理',hair:'#8e8e98',skin:'#e8bb94',shirt:'#e9e9e2',pants:'#41444f',tie:'#3b5ba5',glasses:true,seat:[10,2],screen:'sheet'},
 {id:'yamamoto',name:'山本 翔',role:'新人',hair:'#b98a52',skin:'#f3c7a0',shirt:'#9cc7ea',pants:'#2e3550',tie:'#d1453b',seat:[1,7],screen:'mail'},
 {id:'nakamura',name:'中村 さくら',role:'人事',hair:'#2a2230',skin:'#f5cfb0',shirt:'#4fb3b0',pants:'#36324a',long:true,collar:false,seat:[4,7],screen:'sheet'},
 {id:'kobayashi',name:'小林 大輔',role:'マーケティング',hair:'#c8612e',skin:'#e7b48a',shirt:'#f08a3c',pants:'#3a3a48',collar:false,seat:[7,7],screen:'design'},
 {id:'suzuki',name:'鈴木 部長',role:'部長',hair:'#cfcfd6',skin:'#e6b48c',shirt:'#34405e',pants:'#2a3048',tie:'#c23b3b',boss:true,seat:[6,11],screen:'sheet'},
];
const PLAYER={id:'you',name:'あなた',role:'営業企画',hair:'#2a3350',skin:'#f1c6a0',shirt:'#f6f3ea',pants:'#2b3352',tie:'#2f7fd0',seat:[10,7],screen:'task'};

let seedN=0;
for(const c of [...STAFF,PLAYER]){
  const [dx,dy]=c.seat;
  if(c.boss){
    const d=add({kind:'desk',x:dx,y:dy,w:3,owner:c.id,screen:c.screen,big:true,seed:seedN++,seatX:dx+1,seatY:dy+1,draw:drawDesk});
    const seat={x:dx+1,y:dy+1,owner:c.id,offX:0,desk:d};seatAt[dy+1][dx+1]=seat;blocked[dy+1][dx+1]=1;
    add({kind:'chair',x:dx+1,y:dy+1,solid:false,seat,big:true,cx:(dx+1)*T+8,sortY:(dy+2)*T+.5,draw:drawChair});
  }else{
    const d=add({kind:'desk',x:dx,y:dy,w:2,owner:c.id,screen:c.screen,seed:seedN++,seatX:dx,seatY:dy+1,draw:drawDesk});
    const seat={x:dx,y:dy+1,owner:c.id,offX:8,desk:d};seatAt[dy+1][dx]=seat;blocked[dy+1][dx]=1;blocked[dy+1][dx+1]=1;
    add({kind:'chair',x:dx,y:dy+1,w:2,solid:false,seat,cx:dx*T+16,sortY:(dy+2)*T+.5,draw:drawChair});
  }
}
add({kind:'printer',x:13,y:2,draw:drawPrinter});
add({kind:'water',x:14,y:2,draw:drawWater});
add({kind:'shelf',x:12,y:7,w:2,seed:3,draw:drawShelf});
[[0,2],[0,7],[14,7],[0,13],[14,13],[16,2],[16,13]].forEach(([x,y],i)=>add({kind:'plant',x,y,seed:i,draw:drawPlant}));

function mods(rows,view,c){
  const g=rows.map(r=>r.split(''));
  const set=(x,y,k)=>{if(g[y]&&x>=0&&x<16)g[y][x]=k;};
  if(c.long){
    if(view==='down'){for(let y=9;y<=11;y++){set(1,y,'o');set(2,y,'h');set(3,y,'h');set(12,y,'h');set(13,y,'h');set(14,y,'o');}[2,3,12,13].forEach(x=>set(x,12,'o'));}
    if(view==='up'){for(let y=9;y<=11;y++){set(2,y,'o');for(let x=3;x<=12;x++)set(x,y,'h');set(13,y,'o');}for(let x=3;x<=12;x++)set(x,12,'H');}
    if(view==='side'){for(let y=9;y<=12;y++){set(10,y,'h');set(11,y,'h');set(12,y,'o');}set(10,13,'o');set(11,13,'o');}
  }
  if(c.glasses){
    if(view==='down'){[4,6,7,8,9,11].forEach(x=>set(x,7,'g'));}
    if(view==='side'){set(3,7,'g');set(5,7,'g');set(6,7,'g');}
  }
  if(c.tie&&view==='side'){set(6,12,'t');set(6,13,'t');}
  return g;
}
function makeSprite(g,pal){
  const cn=document.createElement('canvas');cn.width=16;cn.height=20;const x2=cn.getContext('2d');

  return cn;
}
function buildSprites(c){

    w:c.collar===false?c.shirt:'#f3efe6',p:c.pants,b:'#2b2530',g:'#4a4560'};
  const mk=(rows,view)=>makeSprite(mods(rows,view,c),pal);
  c.spr={
    down:[mk(DOWN,'down'),mk(withLegs(DOWN,LEGS_DA),'down'),mk(withLegs(DOWN,LEGS_DB),'down')],

}

const ents=[],byId={};
const occ=new Map();const key=(x,y)=>x+','+y;
function occAt(x,y){return occ.get(key(x,y));}
function setOcc(x,y,e){occ.set(key(x,y),e);}
function clrOcc(x,y,e){if(occ.get(key(x,y))===e)occ.delete(key(x,y));}
function makeEnt(c){
  const e=Object.assign({x:0,y:0,dir:'up',moving:false,t:0,walk:0,path:null,wait:0,sitting:false,pose:null,state:'sit',timer:0,
    icon:null,iconT:0,amb:rand(3,12),seed:Math.random(),speed:3.2,typing:0,talking:false,goal:null,act:null},c);
  buildSprites(e);ents.push(e);byId[e.id]=e;
  const [sx,sy]=c.boss?[c.seat[0]+1,c.seat[1]+1]:[c.seat[0],c.seat[1]+1];
  e.seat=seatAt[sy][sx];
  return e;
}
STAFF.forEach(makeEnt);

function walkable(x,y,e,isGoal){
  if(x<0||y<0||x>=COLS||y>=ROWS)return false;
  const s=seatAt[y][x];if(s)return s.owner===e.id;
  if(sitSpot[y][x])return !!isGoal;
  return !blocked[y][x];
}
function canEnter(e,x,y){if(!walkable(x,y,e,true))return false;const o=occAt(x,y);return !o||o===e;}
function findPath(e,sx,sy,gx,gy,avoid){
  if(sx===gx&&sy===gy)return [];
  if(!walkable(gx,gy,e,true))return null;
  const prev=new Int16Array(COLS*ROWS).fill(-1),start=sy*COLS+sx;prev[start]=start;const q=[start];
  for(let qi=0;qi<q.length;qi++){
    const c=q[qi],cx=c%COLS,cy=(c/COLS)|0;
    if(cx===gx&&cy===gy){const p=[];let k=c;while(k!==start){p.push([k%COLS,(k/COLS)|0]);k=prev[k];}return p.reverse();}
    for(const [dx,dy] of DIRS4){
      const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      const ni=ny*COLS+nx;if(prev[ni]!==-1)continue;
      if(!walkable(nx,ny,e,nx===gx&&ny===gy))continue;
      if(avoid){const o=occAt(nx,ny);if(o&&o!==e)continue;}
      prev[ni]=c;q.push(ni);
    }
  }
  return null;
}
function startMove(e,nx,ny){e.dir=dirTo(e.x,e.y,nx,ny);e.moving=true;e.t=0;e.tx=nx;e.ty=ny;e.sitting=false;e.pose=null;setOcc(nx,ny,e);}
function advance(e,dt){e.t+=dt*e.speed;e.walk+=dt;if(e.t>=1){clrOcc(e.x,e.y,e);e.x=e.tx;e.y=e.ty;e.moving=false;e.t=0;return true;}return false;}
function tilePx(e,x,y){const s=seatAt[y][x];return [x*T+(s&&s.owner===e.id?s.offX:0),y*T];}
function entPos(e){const a=tilePx(e,e.x,e.y);if(!e.moving)return a;const b=tilePx(e,e.tx,e.ty);return [a[0]+(b[0]-a[0])*e.t,a[1]+(b[1]-a[1])*e.t];}

const taken=new Set();
const isLunch=()=>S.min>=720&&S.min<780;
function weighted(list){let tot=0;for(const [,w] of list)tot+=w;let r=Math.random()*tot;for(const [k,w] of list){if((r-=w)<0)return k;}return list[0][0];}
function seatDur(n){return isLunch()?rand(3,7):n.boss?rand(14,28):rand(9,22);}
function startActivity(n){
  const pool=n.boss?[['patrol',5],['meeting',2],['coffee',1],['board',1],['window',1]]
    :isLunch()?[['coffee',2],['vending',2],['fridge',2],['sofa',3],['chat',4],['meeting',2]]
    :[['coffee',3],['water',2],['printer',2],['meeting',2],['board',1],['vending',1],['fridge',1],['shelf',1],['sofa',1],['chat',2],['window',1]];
  for(let attempt=0;attempt<4;attempt++){
    const act=weighted(pool);let spot=null;
    if(act==='patrol'){
      const c=[];for(const y of [4,5,6,9,10,13])for(let x=0;x<15;x++)if(walkable(x,y,n,false)&&!occAt(x,y))c.push([x,y,pick(['up','down','left','right'])]);
      spot=pick(c);
    }else{
      const free=ACT[act].spots.filter(s=>!taken.has(key(s[0],s[1]))&&!occAt(s[0],s[1]));
      if(free.length)spot=pick(free);
    }
    if(!spot)continue;
    const path=findPath(n,n.x,n.y,spot[0],spot[1],false);
    if(!path)continue;
    const k=act==='patrol'?null:key(spot[0],spot[1]);if(k)taken.add(k);
    n.goal={type:'spot',act,x:spot[0],y:spot[1],dir:spot[2],pose:spot[3]||null,k};
    n.sitting=false;n.icon=null;n.path=path;n.state='walk';n.wait=0;
    if(!path.length)arrive(n);
    return;
  }
  n.timer=rand(2,4);
}
function goHome(n){
  if(n.goal&&n.goal.k){taken.delete(n.goal.k);}
  n.sitting=false;n.icon=null;n.act=null;
  const path=findPath(n,n.x,n.y,n.seat.x,n.seat.y,false);
  if(!path){n.timer=1.5;n.state='idle';return;}
  n.goal={type:'home'};n.path=path;n.state='walk';n.wait=0;
  if(!path.length)arrive(n);
}
function arrive(n){
  const g=n.goal;n.path=null;
  if(g.type==='home'){
    if(n.x===n.seat.x&&n.y===n.seat.y){n.state='sit';n.sitting=true;n.pose='desk';n.dir='up';n.timer=seatDur(n);n.icon=null;}
    else{n.state='idle';n.timer=rand(.8,2);}
    return;
  }
  if(n.x===g.x&&n.y===g.y){
    n.state='idle';n.act=g.act;n.dir=g.dir;if(g.pose){n.sitting=true;n.pose=g.pose;}
    n.icon=(isLunch()&&['chat','sofa','meeting'].includes(g.act))?'rice':ACT[g.act].icon;
    n.timer=rand(...ACT[g.act].dur);
  }else{if(g.k)taken.delete(g.k);n.goal={type:'none'};n.state='idle';n.act=null;n.timer=rand(.8,2);}
}
function stepAlong(e,dt){
  if(e.moving){if(advance(e,dt)){e.path.shift();if(!e.path.length)return true;}return false;}
  if(!e.path||!e.path.length)return true;
  const [nx,ny]=e.path[0],o=occAt(nx,ny);
  if(o&&o!==e){
    e.wait+=dt;
    if(e.wait>.7){const g=e.path[e.path.length-1],np=findPath(e,e.x,e.y,g[0],g[1],true);
      if(np&&np.length){e.path=np;e.wait=.35;}else if(e.wait>3){e.path=[];e.wait=0;return true;}}
    return false;
  }
  e.wait=0;startMove(e,nx,ny);return false;
}
function updateNPC(n,dt){
  if(n.talking)return;
  if(n.state==='chase'){updateChase(n,dt);return;}
  if(n.state==='walk'){if(stepAlong(n,dt))arrive(n);return;}
  if(n.state==='sit'){
    n.amb-=dt;if(n.amb<=0){n.amb=rand(6,16);if(!n.icon&&Math.random()<.5){n.icon=pick(['dots','bulb','note','dots']);n.iconT=2.2;}}
    if(n.iconT>0){n.iconT-=dt;if(n.iconT<=0)n.icon=null;}
  }
  n.timer-=dt;if(n.timer>0)return;
  if(n.state==='sit')startActivity(n);else goHome(n);
}

/* ---------------- player ---------------- */
const held=[];
function playerTryDir(d){
  const p=player;
  if(p.sitting){
    const [dx,dy]=DV[d];let nx=p.x+dx,ny=p.y+dy;
    if(!canEnter(p,nx,ny)){nx=p.x;ny=p.y+1;if(!canEnter(p,nx,ny))return;}
    startMove(p,nx,ny);return;
  }
  p.dir=d;const [dx,dy]=DV[d],nx=p.x+dx,ny=p.y+dy;
  if(canEnter(p,nx,ny))startMove(p,nx,ny);
}
function onPlayerArrive(){
  const p=player,s=seatAt[p.y][p.x];
  if(s&&s.owner==='you'){p.sitting=true;p.pose='desk';p.dir='up';
    if(!S.firstSat){S.firstSat=true;toast('自分の席に着いた。Space（A）で仕事を進めよう');}}
  else if(sitSpot[p.y][p.x]){p.sitting=true;p.pose=sitSpot[p.y][p.x];p.dir='up';}
}
function updatePlayer(dt){
  const p=player;if(p.typing>0)p.typing-=dt;
  if(p.moving){if(advance(p,dt))onPlayerArrive();else return;}
  if(dlg.open)return;
  const d=held[held.length-1];
  if(d){p.path=null;p.pending=null;playerTryDir(d);return;}
  if(p.path&&p.path.length){
    const [nx,ny]=p.path[0];
    if(canEnter(p,nx,ny)){p.path.shift();p.wait=0;startMove(p,nx,ny);}
    else{p.wait+=dt;if(p.wait>1){p.path=null;p.pending=null;p.wait=0;}}
    return;
  }
  if(p.pending){const [tx,ty]=p.pending;p.pending=null;if(Math.abs(tx-p.x)+Math.abs(ty-p.y)===1){p.dir=dirTo(p.x,p.y,tx,ty);interactAt(tx,ty);}}
}

  if(S.min>=1080&&Math.random()<.5)return pick(EVENING);

const SLACK_WARN=35, SLACK_CHASE=50; // ゲーム内の分
function onDuty(){return S.min>=570&&S.min<1080&&!isLunch();}
function checkSlack(dt){
  const p=player,boss=byId.suzuki;
  if(!onDuty()){S.lastWork=S.min;S.warned=false;return;}
  if(p.sitting&&p.pose==='desk')S.lastWork+=dt;            // 席にいる間はサボり時間が増えない
  else if(p.sitting&&p.pose==='sitUp')S.lastWork-=dt;      // ソファでくつろぐと2倍の速さで増える
  if(boss.state==='chase'||boss.talking||dlg.open)return;
  const slack=S.min-S.lastWork;
  if(slack>=SLACK_WARN&&!S.warned){S.warned=true;toast('部長の視線を感じる…');boss.icon='q';boss.iconT=3;}
  if(slack>=SLACK_CHASE&&!(p.sitting&&p.pose==='desk'))startChase(boss);
}
function startChase(b){
  if(b.goal&&b.goal.k)taken.delete(b.goal.k);
  Object.assign(b,{goal:{type:'chase'},state:'chase',sitting:false,pose:null,act:null,icon:'anger',iconT:0,speed:4.6,chaseT:0,repath:0,path:null,wait:0});
  toast('部長がこっちに来る…！');
}
function endChase(b,why){
  b.speed=3.2;b.icon=null;S.warned=false;
  if(why==='safe'){S.lastWork=S.min-15;toast('セーフ…！ 部長は席に戻っていった');}
  else{S.lastWork=S.min-25;toast('部長をまいた…。あとが怖い');}
  b.goal=null;goHome(b);
}
function updateChase(n,dt){
  const p=player;n.chaseT+=dt;
  if(p.sitting&&p.pose==='desk'&&!n.moving){endChase(n,'safe');return;}
  if(n.chaseT>20&&!n.moving){endChase(n,'escaped');return;}
  if(!n.moving&&!p.moving&&!dlg.open&&Math.abs(n.x-p.x)+Math.abs(n.y-p.y)===1){scold(n);return;}
  if(!n.moving){n.repath-=dt;if(n.repath<=0||!n.path||!n.path.length){n.repath=.5;n.path=pathToAdjacent(n,p.x,p.y);if(!n.path)return;}}
  if(n.path&&(n.path.length||n.moving))stepAlong(n,dt);
}

function drawEnt(e,pos,t){
  let spr,dx=pos[0],dy=pos[1]-4,flip=false;
  if(e.sitting){
    if(e.pose==='sitDown'){spr=e.spr.down[0];dy=pos[1]+2;}
    else{spr=e.spr.sit;dy=pos[1]-3;if(e.pose==='desk'&&isTyping(e,t))dy+=Math.floor(t*7+e.seed*3)%2;}
  }else{
    R(pos[0]+3,pos[1]+14,10,2,'rgba(0,0,0,.25)');
    const step=e.moving?1+(Math.floor(e.walk*7)%2):0;
    if(e.dir==='down')spr=e.spr.down[step];
    else if(e.dir==='up')spr=e.spr.up[step];
    else{spr=e.spr.left[step===1?1:0];flip=e.dir==='right';if(step===2)dy-=1;}
  }
  dx=Math.round(dx);dy=Math.round(dy);
  if(flip){ctx.save();ctx.translate(dx+16,dy);ctx.scale(-1,1);ctx.drawImage(spr,0,0);ctx.restore();}
  else ctx.drawImage(spr,dx,dy);
  e._dy=dy;e._dx=dx;
}
function render(t){
  const vw=VW*T,vh=VH*T,pp=entPos(player);
  camX=Math.round(clamp(pp[0]+8-vw/2,0,W-vw));camY=Math.round(clamp(pp[1]+8-vh/2,0,H-vh));
  const sh=S.shake>0?2:0,sx=sh?Math.round(Math.random()*sh*2-sh):0,sy=sh?Math.round(Math.random()*sh*2-sh):0;
  ctx.setTransform(1,0,0,1,-camX+sx,-camY+sy);
  ctx.drawImage(bg,0,0);
  const sky=skyAt(S.min);
  for(const d of decor)drawDecor(d,t,sky);
  const list=[];
  for(const f of furn)list.push([f.sortY,f,null]);
  for(const e of ents){const pos=entPos(e);list.push([pos[1]+16-(e.sitting?.1:0),e,pos]);}
  list.sort((a,b)=>a[0]-b[0]);
  for(const it of list){if(it[2])drawEnt(it[1],it[2],t);else it[1].draw(it[1],t);}
  if(!S.firstSat){const s=player.seat,bx=s.x*T+s.offX+5,by=s.y*T-14+(Math.floor(t*3)%2);R(bx,by,7,1,'#ffcf4a');R(bx+1,by+1,5,1,'#ffcf4a');R(bx+2,by+2,3,1,'#ffcf4a');R(bx+3,by+3,1,1,'#ffcf4a');R(bx,by-1,7,1,O);}
  for(const e of ents){if(e.icon)drawBubble(e._dx+3,e._dy-11+(Math.floor(t*2+e.seed*4)%2),e.icon);}
  if(!player.sitting&&!player.icon){const x=player._dx+8,y=player._dy-5+(Math.floor(t*2.5)%2);R(x-2,y,5,1,'#ffcf4a');R(x-1,y+1,3,1,'#ffcf4a');R(x,y+2,1,1,'#ffcf4a');}
  ctx.setTransform(1,0,0,1,0,0);
  if(S.flash>0)R(0,0,cv.width,cv.height,'rgba(230,40,40,'+(S.flash*.6).toFixed(3)+')');
  const ev=clamp((S.min-990)/60,0,1)*(1-clamp((S.min-1090)/40,0,1)),nf=clamp((S.min-1080)/60,0,1);
  if(ev>0)R(0,0,cv.width,cv.height,'rgba(255,140,60,'+(ev*.08).toFixed(3)+')');
  if(nf>0)R(0,0,cv.width,cv.height,'rgba(30,40,110,'+(nf*.14).toFixed(3)+')');
}

window.addEventListener('keydown',ev=>{
  if(ev.target&&/input|textarea|select/i.test(ev.target.tagName))return;
  const d=DIRK[ev.code];
  if(d){ev.preventDefault();if(!held.includes(d)&&!dlg.open)held.push(d);player.path=null;player.pending=null;return;}
  if(ev.code==='Space'||ev.code==='KeyZ'||ev.code==='Enter'){ev.preventDefault();if(!ev.repeat)action();}
});
window.addEventListener('keyup',ev=>{const d=DIRK[ev.code];if(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1);}});
window.addEventListener('blur',()=>{held.length=0;});
document.querySelectorAll('.dpad button').forEach(b=>{
  const d=b.dataset.dir;
  const on=ev=>{ev.preventDefault();if(dlg.open)return;if(!held.includes(d))held.push(d);b.classList.add('on');player.path=null;player.pending=null;};
  const off=()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
$('abtn').addEventListener('pointerdown',ev=>{ev.preventDefault();action();});
function pathToAdjacent(e,tx,ty){
  let best=null;
  for(const [dx,dy] of DIRS4){const ax=tx+dx,ay=ty+dy;if(ax<0||ay<0||ax>=COLS||ay>=ROWS)continue;if(ax===e.x&&ay===e.y)return [];
    if(seatAt[ay][ax]&&seatAt[ay][ax].owner!==e.id)continue;if(sitSpot[ay][ax])continue;
    const p=findPath(e,e.x,e.y,ax,ay,false);if(p&&(!best||p.length<best.length))best=p;}
  return best;
}
cv.addEventListener('pointerdown',ev=>{
  cv.focus({preventScroll:true});
  if(dlg.open){advanceDlg();return;}
  const r=cv.getBoundingClientRect(),wx=(ev.clientX-r.left)/r.width*cv.width+camX,wy=(ev.clientY-r.top)/r.height*cv.height+camY;
  const tx=Math.floor(wx/T),ty=Math.floor(wy/T),p=player;held.length=0;
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return;
  if(tx===p.x&&ty===p.y){action();return;}
  const s=seatAt[ty][tx];
  if(s&&s.owner==='you'){const path=findPath(p,p.x,p.y,tx,ty,false);if(path){p.path=path;p.pending=null;}return;}
  if(sitSpot[ty][tx]){const path=findPath(p,p.x,p.y,tx,ty,false);if(path){p.path=path;p.pending=null;}return;}
  const e=occAt(tx,ty),o=objAt[ty][tx];
  if((e&&e!==p)||o){const path=pathToAdjacent(p,tx,ty);if(path){p.path=path;p.pending=[tx,ty];}return;}
  if(walkable(tx,ty,p,true)){const path=findPath(p,p.x,p.y,tx,ty,false);if(path){p.path=path;p.pending=null;}}
});

/* ---------------- layout & loop ---------------- */
function layout(){
  const w=screenEl.parentElement.clientWidth,narrow=w<640;
  const nVW=narrow?14:COLS,nVH=narrow?12:ROWS;
  if(nVW!==VW||nVH!==VH||cv.width!==nVW*T){VW=nVW;VH=nVH;cv.width=VW*T;cv.height=VH*T;}
  ctx.imageSmoothingEnabled=false;
  document.documentElement.style.setProperty('--ar',(VW/VH).toFixed(4));
}
window.addEventListener('resize',layout);

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(!dayTurning){
    S.min=Math.min(S.min+dt,1170.5);timeEvents();checkSlack(dt);
    for(const n of ents)if(n!==player)updateNPC(n,dt);
    updatePlayer(dt);
  }
  if(dlg.open){const page=dlg.pages[dlg.i];if(dlg.shown<page.length){dlg.shown=Math.min(page.length,dlg.shown+dt*40);dtextEl.textContent=page.slice(0,Math.floor(dlg.shown));}}
  if(S.shake>0)S.shake-=dt;if(S.flash>0)S.flash-=dt;
  render(t);
  hudT-=dt;if(hudT<=0){hudT=.2;updateHUD();}
  requestAnimationFrame(loop);
}

function start(data){
  data=data||{};
  placeAtSeats();
  if(typeof data.min==='number'){Object.assign(S,{min:data.min,lastMin:data.min,day:data.day||1,done:data.done||0,taskIdx:data.taskIdx||0,energy:data.energy??80,firstSat:!!data.firstSat,scolded:data.scolded||0,lastWork:data.min});
    S.task={name:TASKS[S.taskIdx],progress:data.prog||0};
    if(typeof data.px==='number'&&walkable(data.px,data.py,player,true)&&!seatAt[data.py][data.px]){clrOcc(player.x,player.y,player);player.x=data.px;player.y=data.py;setOcc(player.x,player.y,player);}}
  else{
    say('鈴木 部長（部長）',['おはよう！ ドット商事 3F へようこそ。','君の席は「▼」がついているデスクだ。座って Space（スマホは A ボタン）で仕事を進めてくれ。','疲れたら右下のラウンジでコーヒーでも飲むといい。みんなにも声をかけてやってくれ。']);
  }
  layout();updateHUD();requestAnimationFrame(t=>{last=t;loop(t);});
}
try{window.claude?.hot?.snapshot?.(()=>({min:S.min,day:S.day,done:S.done,taskIdx:S.taskIdx,prog:S.task.progress,energy:S.energy,firstSat:S.firstSat,scolded:S.scolded,px:player.x,py:player.y}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
